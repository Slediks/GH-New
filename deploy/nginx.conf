map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Match shared.config.MAX_UPLOAD_REQUEST_BYTES: 20 MiB HTML + 20 MiB cover + multipart.
    client_max_body_size 41m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: ws://$http_host; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location /api/arena/assets-admin {
        client_max_body_size 51m;
        proxy_read_timeout 120s;
        proxy_pass http://backend:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
    }
    # A path is NOT a security boundary. The game server supplies its own CSP
    # sandbox header; no allow-same-origin, including direct document requests.
    location ^~ /play/ {
        proxy_pass http://games/;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        # Defining a local add_header prevents inheritance of the app CSP.
        # The upstream's stricter game CSP and no-store/referrer headers pass through.
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location ^~ /internal/ { return 404; }
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 75s;
    }
    location /arena/socket.io/ {
        proxy_pass http://arena:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}

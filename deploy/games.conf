server {
    listen 80;
    server_name _;
    root /games/games;
    autoindex off;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=(), clipboard-write=()" always;
    add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline' data: blob:; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    # Only nginx's fixed /play/ proxy reaches this internal service. Authorization
    # uses a file-scoped capability, never the app cookie or a caller-selected API.
    location ~ ^/[a-zA-Z0-9-]+\.html$ {
        # Fetch Metadata can be absent over non-trustworthy LAN HTTP. Do not
        # require it: the response CSP sandbox is the actual isolation boundary.
        # When the browser supplies metadata, refuse direct tabs/cross-site embeds.
        if ($http_sec_fetch_dest = "document") { return 403; }
        if ($http_sec_fetch_site = "cross-site") { return 403; }
        set $game_ticket $arg_ticket;
        set $game_file $uri;
        auth_request /_authorize;
        limit_except GET { deny all; }
        default_type text/html;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</html>' '<script>(()=>{const session=new URLSearchParams(location.hash.slice(1)).get("session");if(session)["pointerdown","keydown","touchstart"].forEach(type=>addEventListener(type,()=>parent.postMessage({type:"gamehub:input",session},"*"),{passive:true}));})();</script></html>';
        try_files $uri =404;
    }
    location = /_authorize {
        internal;
        proxy_pass http://backend:5000/internal/game-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Game-Ticket $game_ticket;
        proxy_set_header X-Game-File $game_file;
    }
    location / { return 404; }
}
